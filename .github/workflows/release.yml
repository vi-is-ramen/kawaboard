name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

env:
  PYTHON: '3.14'

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with: { python-version: '${{ env.PYTHON }}' }
      - name: Build onefile PE
        run: uv run --group dev python packaging/build.py --onefile
      - name: Rename
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '${{ github.ref_name }}' -replace '^v',''
          if (-not (Test-Path dist\kawaboard.exe)) { throw "dist\kawaboard.exe не найден — сборка упала" }
          Move-Item dist\kawaboard.exe "dist\kawaboard-$v-windows-x64.exe"
      - name: Checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-FileHash "dist\kawaboard-*-windows-x64.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii dist\kawaboard-windows-x64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: win-exe
          path: |
              dist/*.exe
              dist/*.sha256

  linux-elf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with: { python-version: '${{ env.PYTHON }}' }
      - name: Build onefile ELF
        run: uv run --group dev python packaging/build.py --onefile
      - name: Rename
        run: |
          set -euo pipefail
          v=${GITHUB_REF_NAME#v}
          [ -f dist/kawaboard ] || { echo "dist/kawaboard не найден — сборка упала" >&2; exit 1; }
          chmod +x dist/kawaboard
          mv dist/kawaboard "dist/kawaboard-$v-linux-x64"
          sha256sum "dist/kawaboard-$v-linux-x64" > "dist/kawaboard-$v-linux-x64.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-elf
          path: |
            dist/kawaboard-*linux-x64
            dist/kawaboard-*.sha256

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with: { python-version: '${{ env.PYTHON }}' }
      - name: Build onedir (без --onefile, системные либы в рантайме)
        run: uv run --group dev python packaging/build.py
      - name: Install fpm + zstd
        run: |
          sudo gem install fpm --no-document
          sudo apt-get update -y
          sudo apt-get install -y zstd libarchive-tools
      - name: Stage + deb + pacman(zst)
        run: |
          set -euo pipefail
          VER=${GITHUB_REF_NAME#v}; [ -n "$VER" ] || VER=0.0.0
          STAGE=packaging/stage
          mkdir -p "$STAGE/usr/lib/kawaboard" "$STAGE/usr/bin" "$STAGE/usr/share/applications"
          cp -r dist/kawaboard/. "$STAGE/usr/lib/kawaboard/"
          install -m755 packaging/kawaboard-launcher.sh "$STAGE/usr/bin/kawaboard"
          install -m644 packaging/kawaboard.desktop "$STAGE/usr/share/applications/kawaboard.desktop"

          fpm -s dir -t deb -n kawaboard -v "$VER" -a amd64 \
            --maintainer "Ivan Chetchasov <vi.is.chapmann@gmail.com>" \
            --url "https://github.com/vi-is-ramen/kawaboard" \
            --description "Kawaii drawing board with utilities!" \
            --deb-recommends "chromium | google-chrome-stable | firefox" \
            -C "$STAGE" usr

          fpm -s dir -t pacman -n kawaboard -v "$VER" -a x86_64 \
            --maintainer "Ivan Chetchasov <vi.is.chapmann@gmail.com>" \
            --url "https://github.com/vi-is-ramen/kawaboard" \
            --description "Kawaii drawing board with utilities!" \
            --pacman-compression zstd \
            -C "$STAGE" usr
      - name: Checksums
        run: sha256sum kawaboard_* > kawaboard-checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            kawaboard_*
            kawaboard-checksums.txt

  release:
    needs: [windows-exe, linux-elf, packages]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with: { path: assets }
      - name: Add netinst
        run: |
          cp installer/kawaboard-netinst.ps1 assets/
          ls -R assets
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/**/*.exe
            assets/**/kawaboard-*linux-x64
            assets/**/*.deb
            assets/**/*.pkg.tar.zst
            assets/**/*.sha256
            assets/**/kawaboard-checksums.txt
            assets/kawaboard-netinst.ps1
