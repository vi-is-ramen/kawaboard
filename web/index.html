<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кавай-урок ♡</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
    <!-- Левая панель: доска -->
    <div class="board-panel">
        <div class="toolbar">
            <button id="new-board" title="Новая доска"><i class="fas fa-file"></i></button>
            <button id="open-board" title="Открыть доску из файла"><i class="fas fa-folder-open"></i></button>
            <button id="save-board" title="Сохранить доску в файл"><i class="fas fa-save"></i></button>
            <button id="undo-board" title="Отменить"><i class="fas fa-undo"></i></button>
            <button id="clear-board" title="Очистить и сбросить размер"><i class="fas fa-trash-alt"></i></button>
            <button id="brush-tool" class="tool-btn active" title="Кисть"><i class="fas fa-paint-brush"></i></button>
            <button id="eraser-tool" class="tool-btn" title="Ластик"><i class="fas fa-eraser"></i></button>
            <button id="select-tool" class="tool-btn" title="Курсор / выделение (2x клик по тексту — редактировать)"><i class="fas fa-mouse-pointer"></i></button>
            <button id="text-tool" class="tool-btn" title="Текст"><i class="fas fa-font"></i></button>
            <div class="color-picker">
                <button id="palette-btn" class="palette-btn" title="Выбрать цвет"><i class="fas fa-palette"></i></button>
                <input type="color" id="pen-color" value="#FFB6C1" hidden>
                <div class="quick-colors">
                    <span class="color-swatch" style="background:#FFB6C1;" data-color="#FFB6C1"></span>
                    <span class="color-swatch" style="background:#DDA0DD;" data-color="#DDA0DD"></span>
                    <span class="color-swatch" style="background:#98FB98;" data-color="#98FB98"></span>
                    <span class="color-swatch" style="background:#FFDAB9;" data-color="#FFDAB9"></span>
                    <span class="color-swatch" style="background:#AFEEEE;" data-color="#AFEEEE"></span>
                    <span class="color-swatch" style="background:#FFFACD;" data-color="#FFFACD"></span>
                </div>
            </div>
            <label class="size-label"><i class="fas fa-pen-fancy"></i> <input type="range" id="pen-size" min="1" max="20" value="3"></label>
        </div>
        <div class="canvas-wrapper">
            <canvas id="sketchpad"></canvas>
            <input id="text-editor" class="text-editor" hidden autocomplete="off" spellcheck="false">
            <button class="expand-btn" id="expand-canvas" title="Расширить доску вниз~">
                <i class="fas fa-chevron-down"></i>
                <span>ещё местечко~</span>
            </button>
        </div>
    </div>

    <!-- Правая панель: блоки -->
    <div class="blocks-panel">
        <h3><i class="fas fa-cubes"></i> Блоки автоматизации ^_^</h3>
        <div id="blocks-container"></div>
    </div>
</div>
<script src="/eel.js"></script>
<script src="script.js"></script>
</body>
</html>
