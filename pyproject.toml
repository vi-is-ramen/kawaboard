[project]
name = "kawaboard"
version = "0.1.1"
description = "Kawaii drawing board with utilities!"
readme = "README.md"
authors = [
    { name = "Ivan Chetchasov", email = "vi.is.chapmann@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "capstone>=5.0.9",
    "eel>=0.18.2",
    "keystone-engine>=0.9.2",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.11",
    "ruff>=0.8",
    "pyright>=1.1",
]

[project.scripts]
kawaboard = "kawaboard:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "S"]
ignore = ["S603", "S607"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
